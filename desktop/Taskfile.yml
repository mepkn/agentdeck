version: '3'

# macOS only. `wails3 dev` / `wails3 build` / `wails3 package` call these tasks.
vars:
  APP_NAME: "agentdeck"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: 'npm'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: darwin:build

  package:
    summary: Packages a production build of the application (agentdeck.app)
    cmds:
      - task: darwin:package

  run:
    summary: Runs the application
    cmds:
      - task: darwin:run

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
